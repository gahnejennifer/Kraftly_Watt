services:
  frontend:
    build: .
    ports:
      - '8080:80'
    environment:
      API_URL: http://api:4000
      API_KEY: ${API_KEY:?API_KEY saknas – kör cp .env.example .env}
    depends_on:
      - api
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: npm run api
    environment:
      API_KEY: ${API_KEY:?API_KEY saknas – kör cp .env.example .env}
    env_file:
      - .env
